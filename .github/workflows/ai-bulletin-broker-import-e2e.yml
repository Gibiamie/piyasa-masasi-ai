name: AI Bulletin Broker Import E2E

on:
  pull_request:
    branches: [remediation/v30-audit]
    paths:
      - 'ai-infrastructure-bulletin/broker-import.js'
      - 'ai-infrastructure-bulletin/broker-import-csv.js'
      - 'ai-infrastructure-bulletin/portfolio-import-ui.js'
      - 'ai-infrastructure-bulletin/ui-controls.js'
      - 'ai-infrastructure-bulletin/sw.js'
      - 'ai-infrastructure-bulletin/tests/test_broker_import.js'
      - 'quality/automation/e2e/ai-infrastructure-bulletin-broker-import.spec.js'
      - '.github/workflows/ai-bulletin-broker-import-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broker-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript and import engine
        run: |
          node --check ai-infrastructure-bulletin/broker-import.js
          node --check ai-infrastructure-bulletin/broker-import-csv.js
          node --check ai-infrastructure-bulletin/portfolio-import-ui.js
          node --check ai-infrastructure-bulletin/ui-controls.js
          node ai-infrastructure-bulletin/tests/test_broker_import.js
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Validate local broker import workflow
        run: npx playwright test quality/automation/e2e/ai-infrastructure-bulletin-broker-import.spec.js
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-bulletin-broker-import-report
          path: |
            quality/automation/e2e/report
            test-results
          if-no-files-found: ignore
