name: Update MIC market data

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/update_mic_data.py
      - scripts/update_nasdaq_history_batch.py
      - .github/workflows/mic-market-data.yml
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: mic-market-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/update_mic_data.py
      - run: python scripts/update_mic_history.py
        if: github.event_name != 'schedule'
      - run: python scripts/update_nasdaq_history_batch.py
        env:
          MIC_NASDAQ_HISTORY_BATCH: '200'
          MIC_NASDAQ_HISTORY_WORKERS: '10'
      - name: Commit refreshed feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mic/data/market.json mic/data/nasdaq-assets.json mic/data/nasdaq-listed.csv mic/data/nasdaq-quotes.json mic/data/nasdaq-history-state.json mic/data/history
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh MIC market, Nasdaq quotes and history cache"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}"
          done
          exit 1
