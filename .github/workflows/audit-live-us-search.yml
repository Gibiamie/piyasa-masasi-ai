name: Audit Live US Search

on:
  pull_request:
    branches: [remediation/v30-audit]
    paths:
      - 'scripts/audit-live-us-search.mjs'
      - '.github/workflows/audit-live-us-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-us:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Compare live US search universe with Nasdaq
        run: node scripts/audit-live-us-search.mjs
      - name: Upload US search audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-us-search-audit
          path: audit-results/
          if-no-files-found: error
