name: Apply broker import integration

on:
  push:
    branches:
      - feature/broker-portfolio-import
    paths:
      - .github/workflows/_apply-broker-import.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/broker-portfolio-import
          fetch-depth: 0
      - name: Connect import modules and invalidate cache
        run: |
          python - <<'PY'
          from pathlib import Path

          controls = Path('ai-infrastructure-bulletin/ui-controls.js')
          text = controls.read_text(encoding='utf-8')
          marker = 'data-broker-import-core'
          if marker not in text:
              text += r'''

          (function loadBrokerPortfolioImport() {
            if (document.querySelector("script[data-broker-import-core]")) return;
            const core = document.createElement("script");
            core.src = "./broker-import.js?v=2026.07.30.3";
            core.dataset.brokerImportCore = "true";
            core.onload = () => {
              const csv = document.createElement("script");
              csv.src = "./broker-import-csv.js?v=2026.07.30.3";
              csv.dataset.brokerImportCsv = "true";
              csv.onload = () => {
                if (document.querySelector("script[data-broker-import-ui]")) return;
                const ui = document.createElement("script");
                ui.src = "./portfolio-import-ui.js?v=2026.07.30.3";
                ui.dataset.brokerImportUi = "true";
                document.head.appendChild(ui);
              };
              document.head.appendChild(csv);
            };
            document.head.appendChild(core);
          })();
          '''
              controls.write_text(text, encoding='utf-8')

          sw = Path('ai-infrastructure-bulletin/sw.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace('piyasa-masasi-workspace-v9', 'piyasa-masasi-workspace-v10')
          old = '"./ui-controls.js", "./manifest.webmanifest"'
          new = '"./ui-controls.js", "./broker-import.js", "./broker-import-csv.js", "./portfolio-import-ui.js", "./manifest.webmanifest"'
          if old in text:
              text = text.replace(old, new)
          sw.write_text(text, encoding='utf-8')

          Path('.portfolio-import-tmp').unlink(missing_ok=True)
          Path('.github/workflows/_apply-broker-import.yml').unlink(missing_ok=True)
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: connect broker portfolio import to the application"
          git push origin HEAD:feature/broker-portfolio-import
