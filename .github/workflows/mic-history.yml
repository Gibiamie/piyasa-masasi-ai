name: Update MIC chart history

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/update_mic_history.py
      - .github/workflows/mic-history.yml
  schedule:
    - cron: '20 18 * * 1-5'

permissions:
  contents: write

concurrency:
  group: piyasa-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/update_mic_history.py
      - name: Commit chart histories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mic/data/history
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh MIC daily chart histories"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          exit 1
