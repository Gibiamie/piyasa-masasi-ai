name: Market Workspace Validation

on:
  push:
    branches: [remediation/v30-audit]
    paths:
      - 'ai-infrastructure-bulletin/market-integration.js'
      - 'ai-infrastructure-bulletin/market-workspace-core.js'
      - 'ai-infrastructure-bulletin/native-intraday-core.js'
      - 'ai-infrastructure-bulletin/live-session-control.js'
      - 'ai-infrastructure-bulletin/live-market.js'
      - 'ai-infrastructure-bulletin/live-market-core.js'
      - 'ai-infrastructure-bulletin/sw.js'
      - 'ai-infrastructure-bulletin/tests/live-session-control.test.js'
      - 'ai-infrastructure-bulletin/tests/market-core-architecture.test.js'
      - '.github/workflows/live-browser-session.yml'
  pull_request:
    branches: [remediation/v30-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-market-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate JavaScript syntax
        run: |
          node --check ai-infrastructure-bulletin/market-integration.js
          node --check ai-infrastructure-bulletin/market-workspace-core.js
          node --check ai-infrastructure-bulletin/native-intraday-core.js
          node --check ai-infrastructure-bulletin/live-session-control.js
          node --check ai-infrastructure-bulletin/live-market.js
          node --check ai-infrastructure-bulletin/live-market-core.js
          node --check ai-infrastructure-bulletin/sw.js

      - name: Validate architecture and user-controlled monitoring
        run: |
          node ai-infrastructure-bulletin/tests/market-core-architecture.test.js
          node ai-infrastructure-bulletin/tests/live-session-control.test.js

      - name: Verify exact BIST and US intraday symbols
        run: |
          node <<'NODE'
          const symbols = ['ISCTR.IS', 'AEFES.IS', 'LUNR'];
          for (const symbol of symbols) {
            let result = null;
            let lastError = null;
            for (const host of ['query1.finance.yahoo.com', 'query2.finance.yahoo.com']) {
              try {
                const url = `https://${host}/v8/finance/chart/${symbol}?range=1d&interval=5m&events=history&includePrePost=false`;
                const response = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' } });
                if (!response.ok) throw new Error(`${host} HTTP ${response.status}`);
                const payload = await response.json();
                const chart = payload?.chart?.result?.[0];
                const returned = String(chart?.meta?.symbol || '').toUpperCase();
                const validBars = (chart?.indicators?.quote?.[0]?.close || []).filter(Number.isFinite).length;
                if (returned !== symbol) throw new Error(`symbol mismatch: expected ${symbol}, received ${returned}`);
                if (!validBars) throw new Error(`${symbol} returned no valid 5-minute bars`);
                result = { host, validBars };
                break;
              } catch (error) {
                lastError = error;
              }
            }
            if (!result) throw lastError || new Error(`${symbol} failed`);
            console.log(`${symbol}: ${result.validBars} valid 5-minute bars from ${result.host}`);
          }
          NODE
