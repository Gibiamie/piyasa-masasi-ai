name: Market Clean Release

on:
  push:
    branches: [remediation/v30-audit]
    paths:
      - 'ai-infrastructure-bulletin/data/equity-catalog.json'
      - 'ai-infrastructure-bulletin/market-integration.js'
      - 'ai-infrastructure-bulletin/market-core-v2.js'
      - 'ai-infrastructure-bulletin/intraday-core.js'
      - 'ai-infrastructure-bulletin/market-live-session.js'
      - 'ai-infrastructure-bulletin/language-portfolio-runtime.js'
      - 'ai-infrastructure-bulletin/research-core-v2.js'
      - 'ai-infrastructure-bulletin/sw.js'
      - 'ai-infrastructure-bulletin/tests/market-core-clean.test.js'
      - 'ai-infrastructure-bulletin/tests/market-clean-architecture.test.js'
      - 'ai-infrastructure-bulletin/tests/running-market-search.e2e.js'
      - '.github/workflows/market-clean-release.yml'
  pull_request:
    branches: [remediation/v30-audit]
    paths:
      - 'ai-infrastructure-bulletin/data/equity-catalog.json'
      - 'ai-infrastructure-bulletin/market-integration.js'
      - 'ai-infrastructure-bulletin/market-core-v2.js'
      - 'ai-infrastructure-bulletin/intraday-core.js'
      - 'ai-infrastructure-bulletin/market-live-session.js'
      - 'ai-infrastructure-bulletin/language-portfolio-runtime.js'
      - 'ai-infrastructure-bulletin/research-core-v2.js'
      - 'ai-infrastructure-bulletin/sw.js'
      - 'ai-infrastructure-bulletin/tests/market-core-clean.test.js'
      - 'ai-infrastructure-bulletin/tests/market-clean-architecture.test.js'
      - 'ai-infrastructure-bulletin/tests/running-market-search.e2e.js'
      - '.github/workflows/market-clean-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate JavaScript syntax
        run: |
          node --check ai-infrastructure-bulletin/market-integration.js
          node --check ai-infrastructure-bulletin/market-core-v2.js
          node --check ai-infrastructure-bulletin/intraday-core.js
          node --check ai-infrastructure-bulletin/market-live-session.js
          node --check ai-infrastructure-bulletin/language-portfolio-runtime.js
          node --check ai-infrastructure-bulletin/research-core-v2.js
          node --check ai-infrastructure-bulletin/sw.js
          node --check ai-infrastructure-bulletin/tests/running-market-search.e2e.js

      - name: Run market core and architecture tests
        run: |
          node ai-infrastructure-bulletin/tests/market-core-clean.test.js
          node ai-infrastructure-bulletin/tests/market-clean-architecture.test.js

      - name: Install browser test runtime
        run: npm install --no-save playwright@1.55.0

      - name: Start local application
        run: |
          python3 -m http.server 4173 > /tmp/piyasa-http.log 2>&1 &
          echo $! > /tmp/piyasa-http.pid
          sleep 3

      - name: Verify language switching, catalogue search and transaction autofill
        run: node ai-infrastructure-bulletin/tests/running-market-search.e2e.js

      - name: Verify BIST and US scanner simple POSTs
        run: |
          node <<'NODE'
          const cases = [
            { endpoint: 'https://scanner.tradingview.com/turkey/scan', ticker: 'BIST:LMKDC' },
            { endpoint: 'https://scanner.tradingview.com/turkey/scan', ticker: 'BIST:ISCTR' },
            { endpoint: 'https://scanner.tradingview.com/america/scan', ticker: 'NYSE:RDW' }
          ];
          (async () => {
            for (const item of cases) {
              const response = await fetch(item.endpoint, {
                method: 'POST',
                headers: { Accept: 'application/json' },
                body: JSON.stringify({ symbols: { tickers: [item.ticker], query: { types: [] } }, columns: ['name', 'close', 'change', 'volume', 'market_cap_basic', 'update_mode'] })
              });
              if (!response.ok) throw new Error(`${item.ticker} scanner HTTP ${response.status}`);
              const payload = await response.json();
              const row = payload?.data?.find(value => value.s === item.ticker);
              if (!row || !Number.isFinite(Number(row.d?.[1]))) throw new Error(`${item.ticker} returned no valid price`);
              const allowOrigin = response.headers.get('access-control-allow-origin') || '';
              console.log(`${item.ticker}: price=${row.d[1]} cors=${allowOrigin || 'not-declared'}`);
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
