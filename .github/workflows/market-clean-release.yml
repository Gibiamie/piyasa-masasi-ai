name: Market Clean Release

on:
  push:
    branches: [remediation/v30-audit]
    paths:
      - 'ai-infrastructure-bulletin/market-integration.js'
      - 'ai-infrastructure-bulletin/market-core.js'
      - 'ai-infrastructure-bulletin/intraday-core.js'
      - 'ai-infrastructure-bulletin/market-live-session.js'
      - 'ai-infrastructure-bulletin/sw.js'
      - 'ai-infrastructure-bulletin/tests/market-core-clean.test.js'
      - 'ai-infrastructure-bulletin/tests/market-clean-architecture.test.js'
      - 'ai-infrastructure-bulletin/tests/running-market-search.e2e.js'
      - '.github/workflows/market-clean-release.yml'
  pull_request:
    branches: [remediation/v30-audit]
    paths:
      - 'ai-infrastructure-bulletin/market-integration.js'
      - 'ai-infrastructure-bulletin/market-core.js'
      - 'ai-infrastructure-bulletin/intraday-core.js'
      - 'ai-infrastructure-bulletin/market-live-session.js'
      - 'ai-infrastructure-bulletin/sw.js'
      - 'ai-infrastructure-bulletin/tests/market-core-clean.test.js'
      - 'ai-infrastructure-bulletin/tests/market-clean-architecture.test.js'
      - 'ai-infrastructure-bulletin/tests/running-market-search.e2e.js'
      - '.github/workflows/market-clean-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate JavaScript syntax
        run: |
          node --check ai-infrastructure-bulletin/market-integration.js
          node --check ai-infrastructure-bulletin/market-core.js
          node --check ai-infrastructure-bulletin/intraday-core.js
          node --check ai-infrastructure-bulletin/market-live-session.js
          node --check ai-infrastructure-bulletin/sw.js
          node --check ai-infrastructure-bulletin/tests/running-market-search.e2e.js

      - name: Run market core tests
        run: |
          node ai-infrastructure-bulletin/tests/market-core-clean.test.js
          node ai-infrastructure-bulletin/tests/market-clean-architecture.test.js

      - name: Install browser test runtime
        run: npm install --no-save playwright@1.55.0

      - name: Start local application
        run: |
          python3 -m http.server 4173 > /tmp/piyasa-http.log 2>&1 &
          echo $! > /tmp/piyasa-http.pid
          sleep 3

      - name: Verify complete search in the running application
        run: node ai-infrastructure-bulletin/tests/running-market-search.e2e.js

      - name: Verify exact BIST and US intraday symbols
        run: |
          node <<'NODE'
          (async () => {
            for (const symbol of ['ISCTR.IS', 'RDW']) {
              let lastError = null;
              for (const host of ['query1.finance.yahoo.com', 'query2.finance.yahoo.com']) {
                try {
                  const url = `https://${host}/v8/finance/chart/${symbol}?range=1d&interval=5m&events=history&includePrePost=false`;
                  const response = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' } });
                  if (!response.ok) throw new Error(`${host} HTTP ${response.status}`);
                  const payload = await response.json();
                  const chart = payload?.chart?.result?.[0];
                  const returned = String(chart?.meta?.symbol || '').toUpperCase();
                  const validBars = (chart?.indicators?.quote?.[0]?.close || []).filter(Number.isFinite).length;
                  if (returned !== symbol) throw new Error(`expected ${symbol}, received ${returned}`);
                  if (!validBars) throw new Error(`${symbol} returned no valid bars`);
                  console.log(`${symbol}: ${validBars} valid 5-minute bars`);
                  lastError = null;
                  break;
                } catch (error) {
                  lastError = error;
                }
              }
              if (lastError) throw lastError;
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
