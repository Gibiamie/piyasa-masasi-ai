name: Schema contract validation

on:
  push:
    branches:
      - ai-research-schema-contract-rc1
  pull_request:
    branches:
      - remediation/v30-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct delivery ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat schema-contract-payload/part*.b64 | base64 --decode > schema-contract.zip
          echo "d5de93d5f82d3c560677593e3f52acbf8e31443ea4a19a1e7aa715681a2adab0  schema-contract.zip" | sha256sum --check --strict
          mkdir contract-work
          unzip -q schema-contract.zip -d contract-work

      - name: Install package and quality tools
        working-directory: contract-work/ai-research-schema-contract-final
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest
        working-directory: contract-work/ai-research-schema-contract-final
        run: pytest -q

      - name: Ruff
        working-directory: contract-work/ai-research-schema-contract-final
        run: ruff check .

      - name: Mypy
        working-directory: contract-work/ai-research-schema-contract-final
        run: mypy src

      - name: Build and clean wheel install
        working-directory: contract-work/ai-research-schema-contract-final
        run: python scripts/clean_wheel_install.py

      - name: Generate evidence and enforce release gate
        working-directory: contract-work/ai-research-schema-contract-final
        run: |
          python scripts/run_quality_gates.py
          python release_gate.py

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-research-schema-contract-validation
          if-no-files-found: warn
          path: |
            schema-contract.zip
            contract-work/ai-research-schema-contract-final/evidence
            contract-work/ai-research-schema-contract-final/release-report.json
