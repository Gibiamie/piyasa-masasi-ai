name: Piyasa Masasi AI Research Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"
  push:
    branches:
      - remediation/v30-audit
    paths:
      - "ai-infrastructure-bulletin/**"
      - ".github/workflows/ai-infrastructure-bulletin.yml"
  pull_request:
    branches:
      - remediation/v30-audit
    paths:
      - "ai-infrastructure-bulletin/**"
      - ".github/workflows/ai-infrastructure-bulletin.yml"

permissions:
  contents: write

concurrency:
  group: piyasa-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-refresh:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check application syntax
        run: |
          node --check ai-infrastructure-bulletin/portfolio-engine.js
          node --check ai-infrastructure-bulletin/app.js
          node --check ai-infrastructure-bulletin/ui-controls.js
          node --check ai-infrastructure-bulletin/market-integration.js
          node --check ai-infrastructure-bulletin/sw.js
          python -m py_compile ai-infrastructure-bulletin/scripts/update_bulletin.py
          python -m py_compile ai-infrastructure-bulletin/scripts/update_prices.py
          python -m py_compile ai-infrastructure-bulletin/scripts/add_ticker_from_issue.py

      - name: Validate portfolio accounting engine
        run: node ai-infrastructure-bulletin/tests/portfolio-engine.test.js

      - name: Generate bilingual asset-specific research
        run: python ai-infrastructure-bulletin/scripts/update_bulletin.py

      - name: Generate prices and one bilingual evaluation per asset
        run: python ai-infrastructure-bulletin/scripts/update_prices.py

      - name: Validate generated report
        run: python -m unittest discover -s ai-infrastructure-bulletin/tests -v

      - name: Commit refreshed report
        if: github.ref == 'refs/heads/remediation/v30-audit'
        run: |
          if git diff --quiet -- ai-infrastructure-bulletin/data/report.json mic/data/history; then
            echo "No evaluation data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-infrastructure-bulletin/data/report.json mic/data/history
          git commit -m "chore: refresh bilingual asset research"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          exit 1
