name: Update MIC supplemental ETF history

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/update_supplemental_history.py
      - mic/data/supplemental-assets.json
  schedule:
    - cron: '25 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: mic-supplemental-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/update_supplemental_history.py
      - name: Commit refreshed supplemental ETF histories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mic/data/history/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh supplemental ETF histories"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}"
          done
          exit 1
