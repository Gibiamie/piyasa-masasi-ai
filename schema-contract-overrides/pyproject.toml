[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-schema-contract"
version = "1.0.0rc1"
description = "Validated schemas and invariants for source, claim, and canonical-event research records."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.35,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1", "mypy>=1.18,<3", "setuptools>=68"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_research_schema_contract = ["py.typed", "resources/data/*.json", "resources/schemas/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
files = ["src"]
warn_unused_configs = true
ignore_missing_imports = true
