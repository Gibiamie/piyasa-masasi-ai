name: Check MIC market gateway

on:
  push:
    paths:
      - 'backend/market-gateway/**'
      - 'mic/data-governance-v11.*'
      - 'mic/app-core.js'
      - '.github/workflows/mic-market-gateway-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/market-gateway/package.json
      - name: Check browser JavaScript syntax
        run: |
          node --check mic/app-core.js
          node --check mic/data-governance-v11.js
          node --check mic/indicators-v10-patch.js
          node --check mic/chart-workspace-v10.js
      - name: Install gateway dependencies
        working-directory: backend/market-gateway
        run: npm install --ignore-scripts
      - name: Check gateway syntax
        working-directory: backend/market-gateway
        run: npm run check
